<!doctype html>
<!-- The floating pad (popup.py): the DisplayPad app shows this page in a panel at the mouse.
     Clicking a key runs it and the app puts the panel away; folders and page keys move
     inside the panel. Opened in a browser (/pad#t=<token>) it works too, for a look. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DisplayPad</title>
<style>
:root { color-scheme: dark; --k: 72px; --g: 10px; --r: 10px; }
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; cursor: default;
  font: 12px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: rgba(255, 255, 255, .92); }
body:not(.app) { background: #3a3a42; padding: 40px; }
body:not(.app) #pad { background: rgba(38, 38, 44, .96); border-radius: 18px; box-shadow: 0 24px 70px rgba(0, 0, 0, .55); }
body.app #pad { border-radius: 18px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); } /* the panel's edge */
#pad { display: inline-flex; flex-direction: column; gap: 8px; padding: 9px 12px 12px; }
header { display: flex; align-items: center; gap: 4px; height: 26px; }
header button { all: unset; flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
  color: rgba(255, 255, 255, .72); font-size: 15px; }
header button:hover { background: rgba(255, 255, 255, .13); color: #fff; }
header button.off { visibility: hidden; }
header svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; padding-left: 2px; }
#name { flex: none; max-width: 60%; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hint { min-width: 0; color: rgba(255, 255, 255, .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#plate { background: #040405; border-radius: 15px; padding: 10px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07), 0 1px 0 rgba(255, 255, 255, .05); }
#grid { display: grid; grid-template-columns: repeat(6, var(--k)); grid-auto-rows: var(--k); gap: var(--g); }
.key { all: unset; position: relative; width: var(--k); height: var(--k); border-radius: var(--r); overflow: hidden; background: #000;
  transition: transform .07s ease-out, filter .07s ease-out; }
.key img { width: 100%; height: 100%; display: block; -webkit-user-drag: none; }
.key:not(.empty):hover { filter: brightness(1.13); transform: translateY(-1px); }
.key:not(.empty):active, .key.down { transform: scale(.92); filter: brightness(.78); }
.key.empty { background: #0b0b0d; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .035); }
.key.folder::after { content: ""; position: absolute; right: 5px; top: 5px; width: 7px; height: 7px; border-radius: 50%;
  background: rgba(255, 255, 255, .85); box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .55); }
.key:focus-visible { outline: 2px solid #4c8dff; outline-offset: 2px; }
#msg { grid-column: 1 / -1; grid-row: 1 / span 2; display: grid; place-items: center; text-align: center; padding: 0 24px;
  color: rgba(255, 255, 255, .72); line-height: 1.5; }
nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav[hidden] { display: none; }
nav button { all: unset; flex: none; padding: 3px 11px; border-radius: 99px; background: rgba(255, 255, 255, .08);
  color: rgba(255, 255, 255, .8); white-space: nowrap; }
nav button:hover { background: rgba(255, 255, 255, .16); }
nav button[aria-current="true"] { background: rgba(255, 255, 255, .9); color: #111; }
</style>
</head>
<body>
<div id="pad">
  <header>
    <button id="back" class="off" type="button"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
    <div id="title"><span id="name"></span><span id="hint"></span></div>
    <button id="cfg" type="button"><svg viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 11.5h11"/><circle cx="10.5" cy="4.5" r="1.6" fill="currentColor"/><circle cx="5.5" cy="11.5" r="1.6" fill="currentColor"/></svg></button>
  </header>
  <div id="plate"><div id="grid"></div></div>
  <nav id="pages" hidden></nav>
</div>
<script>
"use strict";
const BUILD = "__PAGE_BUILD__";
const TOKEN = new URLSearchParams(location.hash.slice(1)).get("t") || "";
const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.dp;
const TEXT = {
  en: { back: "Back", cfg: "Open the configurator", offline: "The DisplayPad service isn't answering. It starts by itself in a few seconds; if not, open the DisplayPad app.",
        nokey: "Open the DisplayPad app from Applications to see the floating pad.", folder: "folder", ran: "Done", esc: "Esc closes" },
  es: { back: "Volver", cfg: "Abrir el configurador", offline: "El servicio de DisplayPad no responde. Arranca solo en unos segundos; si no, abre la app DisplayPad.",
        nokey: "Abre la app DisplayPad desde Aplicaciones para ver el pad flotante.", folder: "carpeta", ran: "Hecho", esc: "Esc cierra" },
};
const NUM_KEYS = { 1: 0, 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 7: 6, 8: 7, 9: 8, 0: 9, "-": 10, "=": 11 };
let lang = "en", data = null, page = null, stack = [], liveTimer = 0, reloadLater = false, failed = false;
const slots = [];            // per key: {btn, img, id}
const faces = new Map();     // spec + corner + live reading -> object URL (a promise)
const $ = (s) => document.querySelector(s);
const t = (k) => (TEXT[lang] || TEXT.en)[k];
if (native) document.body.classList.add("app");

async function api(path, body) {
  const opts = { headers: { "X-Token": TOKEN } };
  if (body !== undefined) Object.assign(opts, { method: "POST", body: JSON.stringify(body), headers: { "X-Token": TOKEN, "Content-Type": "application/json" } });
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status);
  return r;
}
async function load() {
  const d = await (await api("/api/pad")).json();
  if (d.build && d.build !== BUILD && !BUILD.includes("PAGE_BUILD")) reloadLater = true; // updated: a fresh page next time
  if (!data || d.rev !== data.rev || d.corner !== data.corner) {
    for (const f of faces.values()) f.then(URL.revokeObjectURL, () => {});
    faces.clear();
  }
  data = d; lang = d.language === "es" ? "es" : "en"; failed = false;
  document.documentElement.lang = lang;
  document.documentElement.style.setProperty("--r", (d.corner || 0) * 72 / 102 + "px");
}
function face(spec, sig) {
  const id = JSON.stringify(spec) + "|" + data.corner + "|" + (sig || "");
  let f = faces.get(id);
  if (!f) {
    if (faces.size > 400) { for (const old of faces.values()) old.then(URL.revokeObjectURL, () => {}); faces.clear(); }
    f = api("/api/render?corner=" + data.corner, spec).then(r => r.blob()).then(b => URL.createObjectURL(b));
    f.catch(() => faces.delete(id));
    faces.set(id, f);
  }
  return [id, f];
}

// ---------------------------------------------------------------- pages and folders
const actionsOf = (s) => s.actions || (s.action ? [s.action] : []);
function titleOf(name) {
  const parts = name.split("/");
  let out = parts[0], at = parts[0];
  for (const k of parts.slice(1)) {
    const spec = (data.pages[at] || [])[k - 1] || {};
    out += " › " + (spec.label || spec.emoji || t("folder"));
    at += "/" + k;
  }
  return out;
}
function navOf(spec) { // keys that move inside the floating pad instead of closing it
  if (spec._up) return { to: spec._up, up: true };
  const acts = actionsOf(spec);
  if (spec._folder) return { to: spec._folder, run: acts.length > 0 };
  if (acts.length && acts.every(a => a.type === "page")) return { to: acts[acts.length - 1].page };
  return null;
}
function go(to, up = false) {
  if (to === "back") page = stack.length ? stack.pop() : data.start;
  else if (to === "up" || up) {
    const parent = to === "up" ? (page.includes("/") ? page.slice(0, page.lastIndexOf("/")) : data.start) : to;
    if (stack.length && stack[stack.length - 1] === parent) stack.pop();
    page = parent;
  } else if (data.pages[to] && to !== page) { stack.push(page); stack = stack.slice(-20); page = to; }
  render();
}
function back() {
  if (page.includes("/")) go("up");
  else if (stack.length) go("back");
}

// ---------------------------------------------------------------- drawing
function render() {
  const grid = $("#grid");
  $("#back").classList.toggle("off", !(page && (page.includes("/") || stack.length)));
  $("#back").title = t("back"); $("#cfg").title = t("cfg");
  hint("");
  if (failed || !data) {
    $("#name").textContent = "DisplayPad";
    grid.replaceChildren(Object.assign(document.createElement("div"), { id: "msg", textContent: TOKEN ? t("offline") : t("nokey") }));
    slots.length = 0;
    $("#pages").hidden = true;
    return;
  }
  $("#name").textContent = titleOf(page);
  const keys = data.pages[page] || [];
  if (slots.length !== 12 || !grid.contains(slots[0].btn)) {
    slots.length = 0;
    grid.replaceChildren();
    for (let i = 0; i < 12; i++) {
      const btn = document.createElement("button"), img = new Image();
      btn.type = "button"; btn.className = "key"; img.alt = ""; img.draggable = false;
      btn.append(img);
      btn.addEventListener("click", () => press(i));
      btn.addEventListener("mouseenter", () => hint(labelOf((data.pages[page] || [])[i])));
      btn.addEventListener("mouseleave", () => hint(""));
      grid.append(btn);
      slots.push({ btn, img, id: "" });
    }
  }
  keys.forEach((spec, i) => {
    const s = slots[i];
    s.btn.className = "key" + (spec ? "" : " empty") + (spec && spec._folder ? " folder" : "");
    s.btn.disabled = !spec;
    s.btn.setAttribute("aria-label", spec ? labelOf(spec) || String(i + 1) : "");
    if (!spec) { s.id = ""; s.img.removeAttribute("src"); s.img.hidden = true; return; }
    if (spec.live) return; // drawn by liveTick, with what it shows now
    paint(i, spec, "");
  });
  const top = page.split("/")[0];
  const nav = $("#pages");
  nav.hidden = data.order.length < 2;
  nav.replaceChildren(...data.order.map(name => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = name;
    b.setAttribute("aria-current", String(name === top));
    b.addEventListener("click", () => { if (name !== page) go(name); });
    return b;
  }));
  const cur = nav.querySelector('[aria-current="true"]');
  if (cur) cur.scrollIntoView({ inline: "nearest", block: "nearest" });
  liveTick();
}
function paint(i, spec, sig) {
  const s = slots[i];
  const [id, f] = face(spec, sig);
  if (s.id === id) return;
  s.id = id;
  f.then(url => { if (s.id === id) { s.img.src = url; s.img.hidden = false; } }, () => {});
}
async function liveTick() {
  if (!data || failed) return;
  const keys = data.pages[page] || [];
  const at = [], lives = [];
  keys.forEach((s, i) => { if (s && s.live) { at.push(i); lives.push(s); } });
  if (!lives.length) return;
  const shown = page;
  try {
    const r = await (await api("/api/live", { keys: lives, who: "popup" })).json();
    if (page !== shown) return;
    at.forEach((i, j) => paint(i, lives[j], r.sigs[j] || ""));
  } catch {}
}
function labelOf(spec) {
  if (!spec) return "";
  const name = spec.label || (spec._up ? t("back") : "") || spec.emoji || "";
  return spec._folder ? name + " ›" : name;
}
function hint(text) { $("#hint").textContent = text || (native ? "" : ""); }

// ---------------------------------------------------------------- keys
function press(i) {
  const spec = data && (data.pages[page] || [])[i];
  if (!spec) return;
  const nav = navOf(spec);
  if (nav) {
    if (nav.run) run(i);
    return go(nav.to, nav.up);
  }
  const btn = slots[i].btn;
  btn.classList.add("down");
  setTimeout(() => btn.classList.remove("down"), 140);
  if (native) native.postMessage({ press: { page, key: i + 1 } }); // the app puts the panel away, then runs it
  else run(i).then(ok => ok && hint("✓ " + t("ran")));
}
async function run(i) {
  try { return (await (await api("/api/pad/press", { page, key: i + 1 })).json()).ok; }
  catch (e) { hint(e.message); return false; }
}
function close() { if (native) native.postMessage({ close: true }); }
$("#back").addEventListener("click", back);
$("#cfg").addEventListener("click", () => native ? native.postMessage({ configure: true }) : window.open("/#t=" + TOKEN));
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape") { e.preventDefault(); close(); }
  else if (e.key === "Backspace" || e.key === "ArrowLeft") { e.preventDefault(); back(); }
  else if (e.key in NUM_KEYS && !e.repeat) { e.preventDefault(); press(NUM_KEYS[e.key]); }
});
addEventListener("contextmenu", e => e.preventDefault());

// ---------------------------------------------------------------- the app
function size() {
  const r = $("#pad").getBoundingClientRect();
  return { w: Math.ceil(r.width), h: Math.ceil(r.height) };
}
// called by the app right before it shows the panel: the page the pad shows, fresh
window.dpShow = async () => {
  try { await load(); page = data.pages[data.page] ? data.page : data.start; }
  catch { failed = true; }
  stack = [];
  render();
  clearInterval(liveTimer);
  liveTimer = setInterval(liveTick, 1000);
  return size();
};
window.dpHide = () => {
  clearInterval(liveTimer);
  if (reloadLater) location.reload();
};
// ready ahead of time: the first page's pictures are there when the panel first opens
(async () => {
  try { await load(); page = data.pages[data.page] ? data.page : data.start; } catch { failed = true; }
  render();
  if (!native) liveTimer = setInterval(liveTick, 1000);
  if (native) native.postMessage({ ready: size() });
})();
</script>
</body>
</html>
